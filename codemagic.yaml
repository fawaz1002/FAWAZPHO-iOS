workflows:
  ios-simulator:
    name: FAWAZPHO iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    scripts:
      - name: Prepare project files
        script: |
          mkdir -p FAWAZPHO.xcodeproj/FAWAZPHO
          cp FAWAZPHOApp.swift FAWAZPHO.xcodeproj/FAWAZPHO/FAWAZPHOApp.swift
          cp ContentView.swift FAWAZPHO.xcodeproj/FAWAZPHO/ContentView.swift
          cp Info.plist FAWAZPHO.xcodeproj/FAWAZPHO/Info.plist
          rm -rf FAWAZPHO.xcodeproj/FAWAZPHO/Assets.xcassets
          unzip -q Assets.xcassets.zip -d FAWAZPHO.xcodeproj/FAWAZPHO/

      - name: Build unsigned simulator app
        script: |
          xcodebuild \
            -project FAWAZPHO.xcodeproj/FAWAZPHO.xcodeproj \
            -scheme FAWAZPHO \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        script: |
          mkdir -p build/artifacts
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r ../../../../artifacts/FAWAZPHO-iOS-Simulator.zip FAWAZPHO.app

    artifacts:
      - build/artifacts/FAWAZPHO-iOS-Simulator.zip
