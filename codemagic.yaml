workflows:
  ios-simulator:
    name: FAWAZPHO iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Prepare Assets
        script: |
          rm -rf FAWAZPHO.xcodeproj/FAWAZPHO/Assets.xcassets
          unzip -q Assets.xcassets.zip -d FAWAZPHO.xcodeproj/FAWAZPHO/

      - name: Build unsigned simulator app
        script: |
          xcodebuild -project FAWAZPHO.xcodeproj/FAWAZPHO.xcodeproj -scheme FAWAZPHO -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
